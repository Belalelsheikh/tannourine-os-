<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>تنورين مصر — نظام التشغيل</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --ink:#10222E; --slate:#33505E; --paper:#EDF0EE; --card:#FBFCFB;
  --line:#D3DAD7; --crit:#B23A26; --warn:#C58218; --ok:#0E6E63; --mute:#7C8B92;
  --violet:#5B4A8A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#C8CFCB;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:24px 12px}
.phone{width:100%;max-width:430px;background:var(--paper);border-radius:22px;overflow:hidden;
  box-shadow:0 18px 50px rgba(16,34,46,.28);display:flex;flex-direction:column;min-height:740px;position:relative}
@media(max-width:470px){body{padding:0}.phone{border-radius:0;min-height:100vh;box-shadow:none}}
.bar{background:var(--ink);color:var(--paper);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar .who{font-size:12.5px;opacity:.75}.bar .ttl{font-size:16.5px;font-weight:600}
.bar button{background:none;border:1px solid rgba(237,240,238,.35);color:var(--paper);font-family:inherit;
  font-size:12.5px;padding:5px 10px;cursor:pointer}
.bar button:active{background:rgba(237,240,238,.15)}
.rolechip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--ok);color:#fff;margin-inline-start:6px;vertical-align:middle}
.body{padding:14px;flex:1;overflow-y:auto;padding-bottom:76px}
.hint{font-size:13px;color:var(--slate);margin-bottom:10px}
.small{font-size:12px;color:var(--mute)}
.tabs{position:absolute;bottom:0;right:0;left:0;display:flex;background:var(--ink);border-top:1px solid #0a161e}
.tabs button{flex:1;background:none;border:none;color:var(--paper);opacity:.55;font-family:inherit;
  font-size:12px;padding:10px 2px 12px;cursor:pointer;position:relative;font-weight:500}
.tabs button.on{opacity:1;font-weight:700}
.tabs button.on::after{content:'';position:absolute;top:0;right:20%;left:20%;height:3px;background:var(--ok)}
.badge{position:absolute;top:4px;inset-inline-end:14%;background:var(--crit);color:#fff;font-size:10px;font-weight:700;
  border-radius:99px;min-width:17px;height:17px;line-height:17px;padding:0 4px}
.stat{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.stat>div{flex:1;min-width:29%;background:var(--card);border:1px solid var(--line);padding:8px 10px;text-align:center}
.stat b{display:block;font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600;line-height:1.15}
.stat span{font-size:10.5px;color:var(--slate)}
.stat .bad b{color:var(--crit)}.stat .good b{color:var(--ok)}.stat .w b{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);margin-bottom:9px;padding:11px 13px}
.rowbtn{width:100%;background:var(--card);border:1px solid var(--line);border-right:4px solid var(--line);
  padding:12px 13px;margin-bottom:7px;text-align:right;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;gap:8px;font-family:inherit;transition:background .12s}
.rowbtn:active{background:#E6EBE8}
.rowbtn .nm{font-size:15.5px;font-weight:600;display:block}
.rowbtn .sub{font-size:11.5px;color:var(--mute);display:block;margin-top:1px}
.rowbtn.warn{border-right-color:var(--crit)}.rowbtn.ok{border-right-color:var(--ok)}
.rowbtn.viol{border-right-color:var(--violet)}
.pill{font-size:10.5px;padding:3px 8px;border-radius:99px;white-space:nowrap;font-weight:600}
.pill.r{background:#F6E3DF;color:var(--crit)}.pill.g{background:#DDEAE7;color:var(--ok)}
.pill.y{background:#F5EAD3;color:#8a5c10}.pill.v{background:#E6E1F2;color:var(--violet)}
.pill.n{background:#E4E9E6;color:var(--slate)}
.send{width:100%;padding:14px;background:var(--ink);color:var(--paper);border:none;font-family:inherit;
  font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
.send:disabled{background:#B4BFBA;cursor:not-allowed}
.send.okbtn{background:var(--ok)}
.ghost{width:100%;padding:11px;background:transparent;border:1px solid var(--slate);color:var(--slate);
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:7px}
.mini{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;color:var(--slate)}
.mini.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mini.grn{background:var(--ok);color:#fff;border-color:var(--ok)}
.mini.red{background:var(--crit);color:#fff;border-color:var(--crit)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.err{font-size:13px;color:var(--crit);margin:8px 0;font-weight:600}
.f{margin-bottom:10px}
.f label{display:block;font-size:12.5px;color:var(--slate);margin-bottom:5px}
.f label em{font-style:normal;color:var(--crit);font-weight:700}
.f input,.f select{width:100%;border:1px solid var(--line);background:var(--card);font-family:inherit;
  font-size:15.5px;padding:10px 11px;color:var(--ink)}
.f input:focus,.f select:focus{outline:2px solid var(--ok)}
.step{display:flex;align-items:center;border:1px solid var(--line)}
.step button{width:38px;height:40px;border:none;background:#EDF0EE;font-size:20px;font-weight:600;color:var(--slate);cursor:pointer;font-family:inherit;flex:none}
.step button:active{background:var(--ink);color:var(--paper)}
.step input{flex:1;width:100%;min-width:0;border:none;text-align:center;font-family:'IBM Plex Mono',monospace;
  font-size:18px;font-weight:600;background:var(--card);color:var(--ink);height:40px}
.step input:focus{outline:2px solid var(--ok);outline-offset:-2px}
.step input.zero{color:var(--crit)}
.sku{background:var(--card);border:1px solid var(--line);margin-bottom:9px}
.sku h3{font-size:14.5px;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);background:#F3F6F4;display:flex;justify-content:space-between;align-items:center}
.sku h3 .tag{font-size:10px;font-weight:600;color:var(--violet)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.fcell{background:var(--card);padding:8px 10px}
.fcell label{display:block;font-size:11.5px;color:var(--slate);margin-bottom:4px}
.fcell label em{font-style:normal;color:var(--crit)}
.reason{padding:9px 12px;border-top:1px solid var(--line);background:#FCF6F4}
.reason p{font-size:12px;color:var(--crit);font-weight:600;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--slate)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.photo{width:100%;background:var(--card);border:1px dashed var(--line);padding:13px;margin:4px 0 10px;
  font-family:inherit;font-size:14px;color:var(--slate);cursor:pointer;text-align:center}
.photo.on{border-style:solid;border-color:var(--ok);color:var(--ok);font-weight:600}
.thumb{width:100%;max-height:150px;object-fit:cover;border:1px solid var(--line);margin-bottom:8px}
table.t{width:100%;border-collapse:collapse;background:var(--card);font-size:13px;margin-bottom:10px}
.t th,.t td{border:1px solid var(--line);padding:6px 8px;text-align:right}
.t th{background:#F3F6F4;font-size:11.5px;color:var(--slate)}
.t td.mono{font-family:'IBM Plex Mono',monospace;font-weight:600}
.login-wrap{padding:34px 22px}
.brand{text-align:center;margin-bottom:26px}
.brand h1{font-size:24px;font-weight:700;letter-spacing:.5px}
.brand p{font-size:12.5px;color:var(--slate)}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{font-family:inherit;font-size:12.5px;padding:7px 12px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--slate)}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.toast{position:absolute;bottom:66px;right:14px;left:14px;background:var(--ink);color:var(--paper);
  padding:11px 14px;font-size:13.5px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;text-align:center}
.toast.show{opacity:.96}
.sect{font-size:13px;font-weight:700;color:var(--slate);margin:14px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.day-tabs{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto}
.day-tabs button{font-family:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap}
.day-tabs button.on{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
[hidden]{display:none!important}
.empty{text-align:center;color:var(--mute);font-size:13.5px;padding:26px 10px}
.feeditem{border-right:4px solid var(--line)}
.feeditem.ok{border-right-color:var(--ok)}.feeditem.bad{border-right-color:var(--crit)}
.feeditem.pend{border-right-color:var(--warn)}
</style>
</head>
<body>
<div class="phone">

    </div>
  </div>
  <div class="body" id="view"></div>
  <div class="tabs" id="tabs" hidden></div>
  <div class="toast" id="toast"></div>
</div>

/* ================= SHARED WIDGETS ================= */
function stepperHTML(key,val){return `<div class="step" data-k="${key}">
 <button type="button" data-d="-1">−</button>
 <input inputmode="numeric" value="${val===null||val===undefined?'':val}" placeholder="—">
 <button type="button" data-d="1">+</button></div>`}
function wireSteppers(root,state,onZeroToggle){
 root.querySelectorAll('.step').forEach(st=>{
  const k=st.dataset.k,inp=st.querySelector('input');
  const set=v=>{state[k]=v;inp.value=v===null?'':v;inp.classList.toggle('zero',v===0);if(onZeroToggle)onZeroToggle(k,v)};
  st.querySelectorAll('button').forEach(b=>b.onclick=()=>set(Math.max(0,(state[k]??0)+ +b.dataset.d)));
  inp.oninput=()=>{const v=inp.value.replace(/\D/g,'');set(v===''?null:+v)};
 });
}
function photoInput(btnId,cb){
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';
 inp.onchange=()=>{
  const f=inp.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
   const c=document.createElement('canvas');const sc=Math.min(1,560/Math.max(img.width,img.height));
   c.width=img.width*sc;c.height=img.height*sc;
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   cb(c.toDataURL('image/jpeg',0.55));
  };img.src=URL.createObjectURL(f);
 };
 $(btnId).onclick=()=>inp.click();
}

/* ================= MANAGEMENT ================= */
VIEWS.mgmt.dash=function(){
 const vs=DB.visitsToday;
 const zeros=vs.reduce((a,v)=>a+(v.lines?v.lines.filter(l=>l.sh===0).length:0),0);
 const reps=DB.core.users.filter(u=>u.role==='rep');
 const silent=reps.filter(u=>((DB.core.routes[u.id]||{})[new Date().getDay()]||[]).length>0&&!vs.some(v=>v.rep===u.id));
 const pendOrd=DB.orders.filter(o=>o.st==='pending').length;
 const undel=DB.invoices.filter(v=>v.st!=='delivered').length;
 const custody=DB.collections.filter(c=>c.type==='cheque'&&c.st==='received');
 const openTot=DB.invoices.reduce((a,v)=>a+invOpen(v),0);
 $('view').innerHTML=`
  <div class="stat">
   <div class="good"><b>${vs.length}</b><span>زيارات اليوم</span></div>
   <div class="${silent.length?'bad':''}"><b>${silent.length}</b><span>مندوبين صامتين</span></div>
   <div class="${zeros?'bad':''}"><b>${zeros}</b><span>أصناف صفر اليوم</span></div>
   <div class="${pendOrd?'w':''}"><b>${pendOrd}</b><span>أوردرات معلقة</span></div>
   <div class="${undel?'w':''}"><b>${undel}</b><span>فواتير لم تُسلَّم</span></div>
   <div class="${custody.length?'w':''}"><b>${custody.length}</b><span>شيكات بالعهدة</span></div>
  </div>
  <div class="card"><span class="small">إجمالي المستحقات المفتوحة</span><br><b style="font-size:22px;font-family:'IBM Plex Mono',monospace">${fmt(openTot)} ج</b></div>
  ${silent.length?`<div class="card feeditem bad"><b>بدون زيارات اليوم:</b><br><span class="small">${silent.map(u=>u.name).join(' · ')}</span></div>`:''}
  <div class="sect">آخر النشاط</div>
  ${vs.slice(-6).reverse().map(v=>{const o=outlet(v.o);const u=userById(v.rep)||{name:'؟'};
   return `<div class="card"><span class="small">${new Date(v.ts).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span> — <b>${u.name}</b> زار ${o.name}</div>`}).join('')||'<p class="empty">مفيش نشاط لسه</p>'}`;
};
VIEWS.mgmt.stock=function(){
 const out={};DB.skus.forEach(s=>out[s.id]=0);
 DB.invoices.forEach(v=>Object.entries(v.lines).forEach(([k,c])=>{if(out[k]!==undefined)out[k]+=c}));
 const inn={};DB.skus.forEach(s=>inn[s.id]=0);
 DB.containers.forEach(ct=>Object.entries(ct.lines).forEach(([k,c])=>{if(inn[k]!==undefined)inn[k]+=c}));
 $('view').innerHTML=`
  <div class="sect">رصيد الدفاتر (كرتونة) — وارد الحاويات ناقص المفوتر</div>
  <table class="t"><tr><th>الصنف</th><th>وارد</th><th>خرج</th><th>الرصيد</th></tr>
  ${DB.skus.map(s=>{const bal=inn[s.id]-out[s.id];
   return `<tr><td>${s.n}</td><td class="mono">${inn[s.id]}</td><td class="mono">${out[s.id]}</td><td class="mono" style="color:${bal<=0?'var(--crit)':'inherit'}">${bal}</td></tr>`}).join('')}</table>
  <p class="small">الرصيد دفتري — قارنه بالجرد الفعلي دوريًا. أي فرق = تسرب أو خطأ تسجيل.</p>
  <div class="sect">تسجيل وصول حاوية</div>
  <div id="clines">${DB.skus.map(s=>`<div class="sku"><h3>${s.n}</h3><div class="fields" style="grid-template-columns:1fr"><div class="fcell"><label>كرتونة</label>${stepperHTML('c_'+s.id,0)}</div></div></div>`).join('')}</div>
  <button class="send" id="csend">تسجيل الحاوية</button>
  <div class="sect">حاويات سابقة</div>
  ${DB.containers.slice(-5).reverse().map(c=>`<div class="card"><b>${c.d}</b> — ${Object.entries(c.lines).map(([k,n])=>sku(k).n+': '+n).join(' · ')}</div>`).join('')||'<p class="empty">لسه مفيش حاويات مسجلة</p>'}`;
 const state={};DB.skus.forEach(s=>state['c_'+s.id]=0);
 wireSteppers($('view'),state);
 $('csend').onclick=async()=>{
  const lines={};DB.skus.forEach(s=>{if(state['c_'+s.id]>0)lines[s.id]=state['c_'+s.id]});
  if(!Object.keys(lines).length){toast('اكتب كميات الحاوية');return}
  const cur=await sget('containers')||[];cur.push({id:uid(),d:todayISO(),lines,by:SESSION.id});
  if(await sset('containers',cur)){DB.containers=cur;toast('اتسجلت الحاوية');render()}
 };
};
VIEWS.mgmt.team=function(){
 $('view').innerHTML=`
  <div class="sect">إضافة مستخدم</div>
  <div class="f"><label>الاسم</label><input id="nn"></div>
  <div class="f"><label>الدور</label><select id="nr"><option value="rep">منسق (ميدان)</option><option value="org">مشرف</option><option value="router">الأوردرات</option><option value="invoice">الفواتير</option><option value="finance">المالية</option><option value="mgmt">إدارة</option></select></div>
  <div class="f"><label>المحافظة</label><select id="ng"><option>القاهرة</option><option>الإسكندرية</option><option>الكل</option></select></div>
  <div class="f"><label>رقم سري (٤ أرقام)</label><input id="np" inputmode="numeric" maxlength="4"></div>
  <button class="send" id="nadd">إضافة</button>
  <div class="sect">المستخدمون (${DB.core.users.length})</div>
  ${DB.core.users.map(u=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <span><b>${u.name}</b><br><span class="small">${ROLE_NAMES[u.role]} · ${u.gov}</span></span>
    ${u.id!==SESSION.id&&u.id!=='u_mgmt'?`<button class="mini red" data-del="${u.id}">حذف</button>`:''}</div>`).join('')}`;
 $('nadd').onclick=async()=>{
  const name=$('nn').value.trim(),pin=$('np').value.trim();
  if(!name||pin.length!==4){toast('الاسم ورقم سري ٤ أرقام مطلوبين');return}
  const core=await sget('core');core.users.push({id:'u_'+uid(),name,role:$('nr').value,pin,gov:$('ng').value});
  if(await sset('core',core)){DB.core=core;toast('اتضاف');render()}
 };
 $('view').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
  if(!confirm('حذف المستخدم؟'))return;
  const core=await sget('core');core.users=core.users.filter(u=>u.id!==b.dataset.del);
  delete core.routes[b.dataset.del];
  if(await sset('core',core)){DB.core=core;render()}
 });
};
VIEWS.mgmt.routes=function(){
 const reps=DB.core.users.filter(u=>u.role==='rep');
 if(!reps.length){$('view').innerHTML='<p class="empty">أضف مندوبين الأول من تبويب الفريق</p>';return}
 let selRep=reps[0].id, selDay=new Date().getDay(), chain='الكل', q='';
 const draw=()=>{
  const cur=(DB.core.routes[selRep]||{})[selDay]||[];
  const chains=['الكل',...new Set(DB.outlets.map(o=>o.chain))];
  const list=DB.outlets.filter(o=>(chain==='الكل'||o.chain===chain)&&(o.name+o.chain).includes(q));
  $('view').innerHTML=`
   <div class="f"><label>المندوب</label><select id="rr">${reps.map(u=>`<option value="${u.id}" ${u.id===selRep?'selected':''}>${u.name}</option>`).join('')}</select></div>
   <div class="day-tabs">${DAY_ORDER.map(d=>`<button class="${d===selDay?'on':''}" data-d="${d}">${DAY_LABELS[d]}</button>`).join('')}</div>
   <p class="hint">مختار: <b>${cur.length}</b> فرع لليوم ده</p>
   <div class="seg">${chains.map(c=>`<button class="${c===chain?'on':''}" data-c="${c}">${c}</button>`).join('')}</div>
   <div class="f"><input id="rq" placeholder="بحث بالاسم" value="${q}"></div>
   <div style="max-height:330px;overflow:auto">${list.map(o=>`
    <button class="rowbtn ${cur.includes(o.i)?'ok':''}" data-i="${o.i}">
     <span><span class="nm">${o.name}</span><span class="sub">${o.chain} · ${o.gov}</span></span>
     ${cur.includes(o.i)?'<span class="pill g">بالخط</span>':''}</button>`).join('')}</div>
   <button class="send okbtn" id="rsave">حفظ خط ${DAY_LABELS[selDay]}</button>`;
  $('rr').onchange=e=>{selRep=e.target.value;draw()};
  $('view').querySelectorAll('.day-tabs button').forEach(b=>b.onclick=()=>{selDay=+b.dataset.d;draw()});
  $('view').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{chain=b.dataset.c;draw()});
  $('rq').oninput=e=>{q=e.target.value.trim();draw();$('rq').focus();$('rq').setSelectionRange(q.length,q.length)};
  $('view').querySelectorAll('.rowbtn').forEach(b=>b.onclick=()=>{
   const i=+b.dataset.i;const r=DB.core.routes[selRep]=DB.core.routes[selRep]||{};
   const arr=r[selDay]=r[selDay]||[];
   const at=arr.indexOf(i);if(at>=0)arr.splice(at,1);else arr.push(i);
   draw();
  });
  $('rsave').onclick=async()=>{
   const core=await sget('core');core.routes=DB.core.routes;
   if(await sset('core',core)){toast('اتحفظ الخط')}
  };
 };
 draw();
};
VIEWS.mgmt.outlets=function(){
 let q='',chain='الكل';
 const draw=()=>{
  const chains=['الكل',...new Set(DB.outlets.map(o=>o.chain))];
  const list=DB.outlets.filter(o=>(chain==='الكل'||o.chain===chain)&&(o.name+o.chain+o.mgr).includes(q)).slice(0,60);
  const unk=DB.outlets.filter(o=>o.pay==='unknown').length;
  $('view').innerHTML=`
   ${unk?`<div class="card feeditem bad"><b>${unk} فرع طريقة دفعهم غير مسجلة</b> <span class="small">(أغلبهم Circle K) — حدّدها من هنا</span></div>`:''}
   <div class="seg">${chains.map(c=>`<button class="${c===chain?'on':''}" data-c="${c}">${c}</button>`).join('')}</div>
   <div class="f"><input id="oq" placeholder="بحث" value="${q}"></div>
   ${list.map(o=>`<div class="card">
    <b>${o.name}</b> <span class="small">— ${o.chain} · ${o.gov}</span><br>
    <span class="small">${o.mgr||''} ${o.tel?'· '+o.tel:''}</span><br>
    <span class="pill ${o.ordering==='central'?'v':'n'}">${ORD_LABEL[o.ordering]}</span>
    <span class="pill ${o.pay==='transfer'?'g':o.pay==='unknown'?'r':'y'}">${PAY_LABEL[o.pay]}</span>
    <div class="btnrow">
     <button class="mini" data-cyc="ordering" data-i="${o.i}">تغيير الأوردر</button>
     <button class="mini" data-cyc="pay" data-i="${o.i}">تغيير الدفع</button>
    </div></div>`).join('')}`;
  $('view').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{chain=b.dataset.c;draw()});
  $('oq').oninput=e=>{q=e.target.value.trim();draw();$('oq').focus();$('oq').setSelectionRange(q.length,q.length)};
  $('view').querySelectorAll('[data-cyc]').forEach(b=>b.onclick=async()=>{
   const i=+b.dataset.i;const outs=await sget('outlets');const o=outs.find(x=>x.i===i);
   if(b.dataset.cyc==='ordering'){o.ordering=o.ordering==='rep'?'mixed':o.ordering==='mixed'?'central':'rep'}
   else{o.pay=o.pay==='cheque'?'transfer':o.pay==='transfer'?'unknown':'cheque'}
   if(await sset('outlets',outs)){DB.outlets=outs;draw()}
  });
 };
 draw();
};

/* ================= BOOT ================= */
(async function(){
 $('view').innerHTML='<p class="empty">جارٍ التحميل…</p>';
 try{
  await ensureSeeds();
  await loadOps();
  render();
 }catch(e){
  $('view').innerHTML='<p class="empty">حصل خطأ في التحميل — اقفل وافتح تاني</p>';
 }
})();
</script>
